[project]
name = "ipromise-agent"
version = "0.1.0"
description = "Evidence-first promise audit agent for iPromise."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
google = [
  "google-adk==2.7.0",
  "google-cloud-build>=3.38,<4",
  "google-cloud-firestore>=2.21,<3",
  "google-genai==2.18.1",
]
github = [
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "ipromise-demo",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipromise_agent"]

[tool.uv.sources]
ipromise-demo = { path = "../../apps/demo_saas", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:BaseAgentConfig is deprecated.*:DeprecationWarning",
]
testpaths = ["tests"]
