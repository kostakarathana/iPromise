<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">iPromise deployed architecture</title>
  <desc id="desc">Cloud Scheduler and the judge console trigger a Cloud Run audit service. Google ADK coordinates Gemini on Vertex AI and deterministic controls against a synthetic SaaS. Firestore stores state. Cloud Build returns a bound verification receipt to the agent, which alone can publish through a scoped GitHub App. Secret Manager and Cloud Logging support the runtime.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b1220" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker>
    <style>
      .bg{fill:#f7f8fa}.card{fill:#fff;stroke:#d9dee8;stroke-width:2}.primary{fill:#172b4d;stroke:#172b4d}.safe{fill:#edf8f3;stroke:#80c9a6}.verify{fill:#fff7e8;stroke:#efb959}.external{fill:#f5f3ff;stroke:#a995e8}.label{font:600 22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#172b4d}.labelw{font:600 22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667085}.subw{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#dbe6f5}.eyebrow{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#47745e;letter-spacing:1.4px}.heading{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#101828}.flow{fill:none;stroke:#667085;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#d08a24;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#98a2b3;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}.flowlabel{font:600 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475467}.pill{fill:#e9f1ff}.pilltext{font:700 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#2457a7;letter-spacing:.8px}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text class="eyebrow" x="72" y="72">IPROMISE · TASKMASTER</text>
  <text class="heading" x="72" y="118">A customer promise becomes verified action</text>
  <text class="sub" x="72" y="151">Deployed Google Cloud vertical slice · synthetic data · bounded side effects</text>

  <rect class="card" filter="url(#shadow)" x="72" y="220" width="245" height="116" rx="18"/>
  <text class="label" x="100" y="264">Cloud Scheduler</text><text class="sub" x="100" y="294">Six-hour OIDC trigger</text><text class="sub" x="100" y="317">Paused outside proof runs</text>
  <rect class="card" filter="url(#shadow)" x="72" y="384" width="245" height="116" rx="18"/>
  <text class="label" x="100" y="428">Judge console</text><text class="sub" x="100" y="458">Next.js on Cloud Run</text><text class="sub" x="100" y="481">Signed session + proxy</text>

  <rect class="primary" filter="url(#shadow)" x="420" y="267" width="330" height="190" rx="22"/>
  <rect class="pill" x="450" y="294" width="118" height="28" rx="14"/><text class="pilltext" x="471" y="313">CLOUD RUN</text>
  <text class="labelw" x="450" y="357">Audit service</text><text class="subw" x="450" y="387">Google ADK graph workflow</text><text class="subw" x="450" y="414">Deterministic evidence + policy</text><text class="subw" x="450" y="441">One correlated run ID</text>

  <rect class="external" filter="url(#shadow)" x="850" y="194" width="250" height="116" rx="18"/>
  <text class="label" x="878" y="238">Gemini 3.5 Flash</text><text class="sub" x="878" y="268">Vertex AI · global</text><text class="sub" x="878" y="291">Typed claim compilation</text>
  <rect class="safe" filter="url(#shadow)" x="850" y="358" width="250" height="116" rx="18"/>
  <text class="label" x="878" y="402">Synthetic SaaS</text><text class="sub" x="878" y="432">Cloud Run reference target</text><text class="sub" x="878" y="455">App + analytics records</text>
  <rect class="card" filter="url(#shadow)" x="850" y="522" width="250" height="116" rx="18"/>
  <text class="label" x="878" y="566">Firestore</text><text class="sub" x="878" y="596">Runs, checkpoints, leases</text><text class="sub" x="878" y="619">OAuth + idempotency state</text>

  <rect class="verify" filter="url(#shadow)" x="420" y="578" width="330" height="132" rx="20"/>
  <text class="label" x="450" y="620">Cloud Build verifier</text><text class="sub" x="450" y="650">Fixed red → green program</text><text class="sub" x="450" y="675">Exact source + candidate tree</text><text class="sub" x="450" y="699">No GitHub credential</text>

  <rect class="external" filter="url(#shadow)" x="1180" y="294" width="210" height="116" rx="18"/>
  <text class="label" x="1208" y="338">GitHub App</text><text class="sub" x="1208" y="368">Repo-scoped token</text><text class="sub" x="1208" y="391">Reconciled write</text>
  <rect class="safe" filter="url(#shadow)" x="1180" y="458" width="210" height="116" rx="18"/>
  <text class="label" x="1208" y="502">Draft PR</text><text class="sub" x="1208" y="532">Exact tested bytes</text><text class="sub" x="1208" y="555">Issue is safe fallback</text>

  <rect class="card" x="72" y="680" width="245" height="96" rx="18"/>
  <text class="label" x="100" y="721">Secret Manager</text><text class="sub" x="100" y="751">Pinned, scoped secrets</text>
  <rect class="card" x="850" y="706" width="250" height="96" rx="18"/>
  <text class="label" x="878" y="747">Cloud Logging</text><text class="sub" x="878" y="777">Structured correlated receipts</text>

  <path class="flow" d="M317 278H380Q410 278 410 308"/><path class="flow" d="M317 442H410"/>
  <path class="flow" d="M750 326C790 326 800 252 840 252"/><path class="flow" d="M750 377H840"/><path class="flow" d="M750 421C800 421 800 580 840 580"/>
  <path class="flow" d="M585 457V568"/><text class="flowlabel" x="601" y="523">candidate + fixed contract</text>
  <path class="return" d="M410 650C367 650 367 500 410 466"/><text class="flowlabel" x="264" y="589">bound receipt returns to agent</text>
  <path class="flow" d="M750 352H1170"/><text class="flowlabel" x="894" y="341">only after receipt passes</text><path class="flow" d="M1285 410V448"/>
  <path class="dash" d="M195 680V530Q195 500 225 500"/><path class="dash" d="M317 728H360Q390 728 420 690"/>
  <path class="dash" d="M750 432C810 432 790 754 840 754"/><path class="dash" d="M750 690C800 690 800 754 840 754"/>

  <line x1="72" y1="842" x2="1368" y2="842" stroke="#d9dee8"/>
  <text class="sub" x="72" y="873">Trust boundary: Gemini proposes structured meaning; deterministic code owns evidence, verification, credentials, and side effects.</text>
</svg>
